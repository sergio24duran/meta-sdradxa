# Compiled-in kernel cmdline for sdradxa-dragon-q6a.
# UEFI EFI-stub boot without initramfs — kernel must know rootfs location.
# EXTEND appends this to whatever UEFI passes, so root= is always present.
CONFIG_CMDLINE="earlycon root=PARTLABEL=rootfs rootwait rw console=ttyMSM0,115200n8"
CONFIG_CMDLINE_EXTEND=y
# CONFIG_CMDLINE_FORCE is not set

# SD/MMC controller drivers built-in (not modules).
# Without initramfs the kernel cannot load modules from the SD card
# where rootfs lives.
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y
CONFIG_MMC_SDHCI_MSM=y

# Realtek RTL8168h/8111h Ethernet (behind PCIe port 0)
CONFIG_R8169=y

# QUP v3 I2C/SPI as modules so they probe AFTER rootfs is mounted
# and can load /lib/firmware/qcom/qcm6490/qupv3fw.elf at probe time.
CONFIG_I2C_QCOM_GENI=m
CONFIG_SPI_QCOM_GENI=m
