# Compiled-in kernel cmdline for sdradxa-dragon-q6a.
# Bundled initramfs handles root selection (A/B slots via slot.conf on ESP).
# EXTEND appends this to whatever UEFI passes.
# "ro" tells the kernel (and initramfs 90-rootfs module) to mount rootfs
# read-only. The 92-overlayroot module layers a tmpfs overlay on top so
# runtime writes go to RAM and the base image is never modified.
CONFIG_CMDLINE="earlycon console=ttyMSM0,115200n8 ro"
CONFIG_CMDLINE_EXTEND=y
# CONFIG_CMDLINE_FORCE is not set

# Bundled initramfs support (A/B root selection)
CONFIG_BLK_DEV_INITRD=y

# overlayfs built-in (not module) so the initramfs can mount the overlay
# before switch_root, without needing /lib/modules from the real rootfs.
CONFIG_OVERLAY_FS=y

# FAT/VFAT built-in so the initramfs can mount the ESP to read slot.conf
CONFIG_VFAT_FS=y
CONFIG_FAT_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y

# SD/MMC controller drivers built-in (not modules).
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y
CONFIG_MMC_SDHCI_MSM=y

# Realtek RTL8168h/8111h Ethernet (behind PCIe port 0)
CONFIG_R8169=y

# QUP v3 I2C/SPI as modules so they probe AFTER rootfs is mounted
# and can load /lib/firmware/qcom/qcm6490/qupv3fw.elf at probe time.
CONFIG_I2C_QCOM_GENI=m
CONFIG_SPI_QCOM_GENI=m
