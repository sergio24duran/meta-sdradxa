# Compiled-in kernel cmdline for sdradxa-dragon-q6a.
# Used as fallback when the bootloader does not pass a cmdline
# (e.g. UEFI EFI-stub auto-boot from removable media).
# The bootloader cmdline always takes precedence when present.
CONFIG_CMDLINE="earlycon root=PARTLABEL=rootfs rootwait rw console=ttyMSM0,115200n8 clk_ignore_unused pd_ignore_unused"
# EXTEND appends compiled-in cmdline to whatever UEFI passes.
# This guarantees root= and rootwait are always present even if UEFI
# passes its own (incomplete) command line.
CONFIG_CMDLINE_EXTEND=y
# CONFIG_CMDLINE_FORCE is not set

# Ensure SD/MMC controller drivers are built-in (not modules).
# Without initramfs, the kernel cannot load modules from rootfs
# to access the SD card where rootfs lives.
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y
CONFIG_MMC_SDHCI_MSM=y

# EFI earlycon for pre-ttyMSM0 console output (debug)
CONFIG_EFI_EARLYCON=y

# Qualcomm PCIe controller (required for RTL8111K Ethernet on port 0).
# Port 1 (pcie@1c08000) has no device connected and will defer-probe
# until timeout — this is expected with the UEFI-provided DTB.
CONFIG_PCI=y
CONFIG_PCI_MSI=y
CONFIG_PCIEPORTBUS=y
CONFIG_PCIEAER=y
CONFIG_PCIE_QCOM=y

# QMP PHY for Qualcomm PCIe lanes
CONFIG_PHY_QCOM_QMP=y
CONFIG_PHY_QCOM_QMP_PCIE=y

# Realtek RTL8168h/8111h Ethernet (behind PCIe port 0)
CONFIG_R8169=y

# Disable Qualcomm UFS controller driver: the UEFI-provided DTB lacks
# the regulator bindings that ufshcd-qcom expects, causing a crash
# during probe. UFS is not needed for SD card boot.
# CONFIG_SCSI_UFS_QCOM is not set
