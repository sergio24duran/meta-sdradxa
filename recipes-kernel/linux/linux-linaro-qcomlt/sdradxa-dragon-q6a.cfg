# Compiled-in kernel cmdline for sdradxa-dragon-q6a.
# Used as fallback when the bootloader does not pass a cmdline
# (e.g. UEFI EFI-stub auto-boot from removable media).
# The bootloader cmdline always takes precedence when present.
CONFIG_CMDLINE="earlycon root=PARTLABEL=rootfs rootwait rw console=ttyMSM0,115200n8 clk_ignore_unused pd_ignore_unused panic=0 oops=panic initcall_debug printk.synchronous=1"
# EXTEND appends compiled-in cmdline to whatever UEFI passes.
# This guarantees root= and rootwait are always present even if UEFI
# passes its own (incomplete) command line.
CONFIG_CMDLINE_EXTEND=y
# CONFIG_CMDLINE_FORCE is not set

# Ensure SD/MMC controller drivers are built-in (not modules).
# Without initramfs, the kernel cannot load modules from rootfs
# to access the SD card where rootfs lives.
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y
CONFIG_MMC_SDHCI_MSM=y

# EFI earlycon for pre-ttyMSM0 console output (debug)
CONFIG_EFI_EARLYCON=y

# Disable Qualcomm PCIe controller driver: causes kernel crash during
# PCI bus enumeration on QCS6490 with linux-linaro-qcomlt 6.6.
# The crash happens at "PCI host bridge to bus 0000:00" after PCIe link-up.
# PCIe is not needed for SD card boot or serial console.
# Re-enable once a fixed kernel (6.13+) or DT workaround is available.
# CONFIG_PCIE_QCOM is not set

# Disable Qualcomm UFS controller driver: causes kernel crash during
# UFS host controller init on QCS6490 with linux-linaro-qcomlt 6.6.
# The crash happens after "ufshcd_populate_vreg: Unable to find
# vdd-hba-supply regulator" — the UEFI-provided DTB lacks the regulator
# bindings that ufshcd-qcom expects.
# UFS is not needed for SD card boot (rootfs is on MMC).
# Re-enable once a proper QCS6490 DTB with UFS regulators is available.
# CONFIG_SCSI_UFS_QCOM is not set
