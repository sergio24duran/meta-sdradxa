# BPK mavlink-router configuration.
#
# Product mode emits no radio: the only endpoint is the on-board bpk-mavlink
# service. mavlink-router owns the FC serial link and exposes it as UDP 14540,
# which bpk-mavlink dials with `udpin://0.0.0.0:14540`.
#
# Dev/telemetry endpoints (SiK, GCS, UDP broadcast) are intentionally NOT
# enabled here; add them via a drop-in for bench/dev only.

[General]
DebugLogLevel = info
# De-dup guards against loops once more endpoints exist; harmless with one.
TcpServerPort = 0

# Flight controller link. UART6 overlay maps the FC to /dev/ttyHS1.
#
# 921600 is not a guess: the 2026-07-19 bench session read MAVLink v1 frames
# off this port with hexdump at 921600, and bpk-mavlink then soaked
# serial:///dev/ttyHS1:921600 for 30 minutes -- 18006 messages, 9.96 Hz, zero
# drops. The 115200 that stood here until 2026-08-25 was a placeholder nobody
# had tested, and it would have looked like a live link delivering nothing.
#
# Still must match the FC's SER_TEL1_BAUD. If frames arrive corrupt rather than
# absent, the next knob is FlowControl (the TELEM1 pigtail carries RTS/CTS).
[UartEndpoint fc]
Device = /dev/ttyHS1
Baud = 921600

# The one companion endpoint: bpk-mavlink listens on udpin 14540 locally.
[UdpEndpoint bpk-mavlink]
Mode = Normal
Address = 127.0.0.1
Port = 14540
