require conf/machine/include/sdradxa-qcm6490.inc

MACHINE_FEATURES = "usbhost usbgadget alsa bluetooth wifi ext2"

# Uncompressed Image is a PE/COFF EFI binary — required for UEFI direct boot.
# Image.gz is NOT a valid EFI application and cannot be loaded by UEFI or
# the bootimg-efi wic plugin with loader=uefi-kernel.
KERNEL_IMAGETYPE ?= "Image"

# No QCM6490 DTB exists in linux-linaro-qcomlt (the kernel used by this project).
# The board receives its DTB from UEFI firmware at boot time.
# TODO: add KERNEL_DEVICETREE once a board-specific DTB is upstreamed.

KERNEL_CMDLINE_EXTRA ?= "clk_ignore_unused pd_ignore_unused"

# Must match CONFIG_CMDLINE in sdradxa-dragon-q6a.cfg and the wks --label.
QCOM_BOOTIMG_ROOTFS ?= "PARTLABEL=rootfs"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    kernel-modules \
    ${@bb.utils.contains('DISTRO_FEATURES', 'opengl', 'mesa-driver-msm', '', d)} \
    ${@bb.utils.contains('DISTRO_FEATURES', 'wifi', 'wireless-regdb-static', '', d)} \
"
