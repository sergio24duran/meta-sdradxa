# meta-sdradxa/conf/layer.conf
#
# Radxa + Qualcomm SoC boards meta layer
#
# This layer provides support for Radxa boards built around Qualcomm SoCs,
# extending meta-qcom with board-specific machine definitions and recipes.
#
# Branch: scarthgap
# Depends on: meta-qcom
#

BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "sdradxa"
BBFILE_PATTERN_sdradxa = "^${LAYERDIR}/"
BBFILE_PRIORITY_sdradxa = "6"

LAYERDEPENDS_sdradxa = "core qcom"

LAYERSERIES_COMPAT_sdradxa = "scarthgap"

BBFILES_DYNAMIC += " \
    openembedded-layer:${LAYERDIR}/dynamic-layers/openembedded-layer/*/*/*.bb \
    openembedded-layer:${LAYERDIR}/dynamic-layers/openembedded-layer/*/*/*.bbappend \
"
