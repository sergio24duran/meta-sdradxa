# BPK hardware watchdog policy (yocto-bpk#60, drilled 2026-07-07).
# systemd pets /dev/watchdog0 (Gunyah Watchdog); if the kernel or PID 1
# hangs for 10 s the SoC resets and boot counting (DEC-024) takes over.
# RebootWatchdogSec covers hangs during the shutdown/reboot path itself.
[Manager]
RuntimeWatchdogSec=10
RebootWatchdogSec=2min
